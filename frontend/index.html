<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeroEngine - AI 어시스턴트 만들기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1.1em;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .chat-container {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.5;
        }

        .message.user {
            background: #667eea;
            color: white;
            margin-left: auto;
        }

        .message.assistant {
            background: white;
            border: 2px solid #e0e0e0;
        }

        .chat-input-group {
            display: flex;
            gap: 10px;
        }

        .chat-input-group input {
            flex: 1;
        }

        .chat-input-group button {
            width: auto;
            padding: 12px 30px;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .preview-image {
            max-width: 200px;
            margin-top: 15px;
            border-radius: 12px;
            border: 3px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 PeroEngine</h1>
        <p class="subtitle">이미지 한 장으로 AI 어시스턴트 만들기</p>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('create')">캐릭터 만들기</button>
            <button class="tab" onclick="switchTab('chat')">대화하기</button>
        </div>

        <!-- 캐릭터 만들기 탭 -->
        <div id="create-tab" class="tab-content active">
            <div id="create-status"></div>

            <form id="create-form">
                <div class="form-group">
                    <label for="character-name">캐릭터 이름</label>
                    <input type="text" id="character-name" placeholder="예: 페로" required>
                </div>

                <div class="form-group">
                    <label for="character-image">캐릭터 이미지 (PNG/JPG)</label>
                    <input type="file" id="character-image" accept="image/*" required>
                    <img id="image-preview" class="preview-image" style="display:none;">
                </div>

                <div class="form-group">
                    <label for="character-persona">성격 설정 (선택사항)</label>
                    <textarea id="character-persona" placeholder="예: 밝고 친근한 성격으로, 항상 긍정적으로 대화합니다."></textarea>
                </div>

                <button type="submit">✨ AI 어시스턴트 만들기</button>
            </form>
        </div>

        <!-- 대화하기 탭 -->
        <div id="chat-tab" class="tab-content">
            <div id="chat-status"></div>

            <div class="chat-container" id="chat-messages"></div>

            <div class="chat-input-group">
                <input type="text" id="chat-input" placeholder="메시지를 입력하세요...">
                <button onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

    <script>
        let currentCharacterId = 'default';

        // 탭 전환
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        // 이미지 미리보기
        document.getElementById('character-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // 캐릭터 생성
        document.getElementById('create-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('character-name').value;
            const imageFile = document.getElementById('character-image').files[0];
            const persona = document.getElementById('character-persona').value;

            const formData = new FormData();
            formData.append('name', name);
            formData.append('image', imageFile);
            formData.append('persona', persona);

            showStatus('create-status', '캐릭터 생성 중...', 'info');

            try {
                const response = await fetch('http://localhost:8000/character/create', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    currentCharacterId = data.character_id;
                    showStatus('create-status', `✅ "${name}" 캐릭터가 생성되었습니다!`, 'success');

                    // 폼 초기화
                    document.getElementById('create-form').reset();
                    document.getElementById('image-preview').style.display = 'none';
                } else {
                    showStatus('create-status', `❌ 오류: ${data.error}`, 'error');
                }
            } catch (error) {
                showStatus('create-status', `❌ 서버 연결 실패: ${error}`, 'error');
            }
        });

        // 메시지 전송
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();

            if (!message) return;

            // 사용자 메시지 표시
            addMessage('user', message);
            input.value = '';

            try {
                const response = await fetch('http://localhost:8000/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        character_id: currentCharacterId
                    })
                });

                const data = await response.json();

                if (data.success) {
                    addMessage('assistant', data.message);
                } else {
                    addMessage('assistant', `오류: ${data.error}`);
                }
            } catch (error) {
                addMessage('assistant', `서버 연결 실패: ${error}`);
            }
        }

        // 메시지 추가
        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.textContent = content;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 상태 메시지 표시
        function showStatus(elementId, message, type) {
            const statusDiv = document.getElementById(elementId);
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 5000);
            }
        }

        // Enter 키로 메시지 전송
        document.getElementById('chat-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
