[project]
name = "pero-engine"
version = "0.1.0"
description = "Create your AI assistant from a single image"
authors = [{name = "PeroEngine Team"}]
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}

dependencies = [
    # Web Framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.33.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",

    # AI/ML
    "torch>=2.2.0",
    "numpy>=1.26.0,<2.0",
    "pillow>=10.0.0",

    # LLM
    "ollama>=0.3.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",

    # TTS
    "edge-tts>=7.0.0",
    "pydub>=0.25.1",
    "soundfile>=0.12.1",

    # ASR
    "openai-whisper>=20231117",
    "faster-whisper>=1.0.0",

    # Utilities
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiofiles>=23.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
