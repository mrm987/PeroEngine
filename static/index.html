<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeroEngine - 립싱크</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #fff;
            margin-bottom: 40px;
            font-size: 3em;
        }

        .character-image {
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        video {
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: none;
        }

        video.show {
            display: block;
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            margin-top: 30px;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            font-size: 16px;
            resize: none;
            height: 100px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            margin-bottom: 20px;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            color: #fff;
            font-size: 14px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 PeroEngine</h1>

        <img id="characterImage" class="character-image" style="display:none;" />
        <video id="videoPlayer" controls></video>

        <div class="controls">
            <input type="file" id="imageInput" class="file-input" accept="image/*" onchange="loadImage(event)">
            <button class="upload-btn" onclick="document.getElementById('imageInput').click()">
                📸 캐릭터 이미지 선택
            </button>

            <textarea id="textInput" placeholder="말할 내용을 입력하세요..."></textarea>

            <button id="generateBtn" onclick="generate()">
                🎥 생성
            </button>

            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        let imageFile = null;

        function loadImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            imageFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('characterImage');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('videoPlayer').classList.remove('show');
            };
            reader.readAsDataURL(file);
        }

        async function generate() {
            const text = document.getElementById('textInput').value.trim();
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('status');

            if (!imageFile) {
                status.textContent = '⚠️ 이미지를 먼저 선택하세요';
                return;
            }

            if (!text) {
                status.textContent = '⚠️ 텍스트를 입력하세요';
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ 생성 중...';
            status.textContent = '🎤 음성 생성 중...';

            try {
                // TTS
                const ttsRes = await fetch('/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!ttsRes.ok) throw new Error('음성 생성 실패');
                const audioBlob = await ttsRes.blob();

                status.textContent = '🎬 립싱크 비디오 생성 중...';

                // Animate
                const formData = new FormData();
                formData.append('image', imageFile);
                formData.append('audio', audioBlob, 'speech.mp3');

                const animateRes = await fetch('/animate', {
                    method: 'POST',
                    body: formData
                });

                if (!animateRes.ok) {
                    const errorData = await animateRes.json();
                    throw new Error(errorData.error || '비디오 생성 실패');
                }

                // Play video
                const videoBlob = await animateRes.blob();
                const videoUrl = URL.createObjectURL(videoBlob);

                const video = document.getElementById('videoPlayer');
                const img = document.getElementById('characterImage');

                img.style.display = 'none';
                video.src = videoUrl;
                video.classList.add('show');
                video.play();

                status.textContent = '✅ 완료!';

            } catch (error) {
                status.textContent = `❌ ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🎥 생성';
            }
        }
    </script>
</body>
</html>
