<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeroEngine - 립싱크 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .upload-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .upload-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .file-input-button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            display: inline-block;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            text-align: center;
        }

        .file-input-button:hover {
            background: #5568d3;
        }

        .preview {
            margin-top: 15px;
            text-align: center;
        }

        .preview img {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 20px;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .video-container {
            margin-top: 30px;
            text-align: center;
            display: none;
        }

        .video-container.show {
            display: block;
        }

        video {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 PeroEngine</h1>
        <p class="subtitle">캐릭터 이미지를 움직이게 만들기</p>

        <div class="upload-section">
            <h2>1️⃣ 캐릭터 이미지 업로드</h2>
            <div class="file-input-wrapper">
                <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
                <div class="file-input-button">이미지 선택</div>
            </div>
            <div id="imagePreview" class="preview"></div>
        </div>

        <div class="upload-section">
            <h2>2️⃣ 말할 내용 입력</h2>
            <textarea id="textInput" placeholder="캐릭터가 말할 내용을 입력하세요...&#10;&#10;예: 안녕하세요! 저는 PeroEngine입니다."></textarea>
        </div>

        <button class="button" onclick="generateVideo()" id="generateBtn">
            🎥 립싱크 비디오 생성
        </button>

        <div id="status" class="status"></div>

        <div id="videoContainer" class="video-container">
            <h2>✨ 생성된 비디오</h2>
            <video id="videoPlayer" controls autoplay></video>
        </div>
    </div>

    <script>
        let uploadedImage = null;

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            uploadedImage = file;

            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('imagePreview');
                preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
            };
            reader.readAsDataURL(file);
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status show ${type}`;
        }

        function hideStatus() {
            const status = document.getElementById('status');
            status.className = 'status';
        }

        async function generateVideo() {
            const text = document.getElementById('textInput').value.trim();

            if (!uploadedImage) {
                showStatus('⚠️ 캐릭터 이미지를 먼저 업로드해주세요!', 'error');
                return;
            }

            if (!text) {
                showStatus('⚠️ 말할 내용을 입력해주세요!', 'error');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 생성 중...';

            showStatus('🎤 음성 생성 중...', 'loading');

            try {
                // 1단계: TTS로 음성 생성
                const ttsResponse = await fetch('/tts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                if (!ttsResponse.ok) {
                    throw new Error('음성 생성 실패');
                }

                const audioBlob = await ttsResponse.blob();

                showStatus('🎬 립싱크 비디오 생성 중... (시간이 걸릴 수 있습니다)', 'loading');

                // 2단계: 이미지 + 오디오 → 비디오
                const formData = new FormData();
                formData.append('image', uploadedImage);
                formData.append('audio', audioBlob, 'speech.mp3');

                const animateResponse = await fetch('/animate', {
                    method: 'POST',
                    body: formData
                });

                if (!animateResponse.ok) {
                    const errorData = await animateResponse.json();
                    throw new Error(errorData.error || '비디오 생성 실패');
                }

                // 3단계: 비디오 재생
                const videoBlob = await animateResponse.blob();
                const videoUrl = URL.createObjectURL(videoBlob);

                const videoPlayer = document.getElementById('videoPlayer');
                videoPlayer.src = videoUrl;

                document.getElementById('videoContainer').classList.add('show');
                showStatus('✅ 비디오 생성 완료!', 'success');

            } catch (error) {
                console.error('Error:', error);
                showStatus(`❌ 오류: ${error.message}`, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🎥 립싱크 비디오 생성';
            }
        }
    </script>
</body>
</html>
