# PeroEngine 설정 파일

# 서버 설정
server:
  host: "localhost"  # 원격 접속: "0.0.0.0"
  port: 8000
  reload: false

# 시스템 설정
system:
  device: "auto"  # auto, cpu, cuda
  mode: "auto"  # auto, background, active, performance
  models_dir: "./models"
  characters_dir: "./characters"

# LLM 설정
llm:
  provider: "ollama"  # ollama, openai, claude

  # Ollama 설정 (로컬)
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:7b"  # 7B 모델 (8GB VRAM/RAM 권장)
    model_active: "qwen2.5:7b"  # 활성 모드용 모델
    auto_download: true  # 모델 자동 다운로드
    # 고사양 GPU(16GB+ VRAM)가 있다면: "gpt-oss:20b" 사용 가능

  # OpenAI 설정 (선택적 API)
  openai:
    api_key: ""  # 비워두면 비활성화
    model: "gpt-3.5-turbo"

  # Claude 설정 (선택적 API)
  claude:
    api_key: ""  # 비워두면 비활성화
    model: "claude-3-haiku-20240307"

# TTS 설정
tts:
  provider: "edge"  # edge, openai

  # Edge TTS 설정 (무료 API)
  edge:
    voice: "ko-KR-SunHiNeural"  # 한국어 여성 목소리
    rate: "+0%"
    volume: "+0%"

  # OpenAI TTS 설정 (선택적 API)
  openai:
    api_key: ""  # 비워두면 비활성화
    model: "tts-1"  # tts-1 or tts-1-hd
    voice: "alloy"  # alloy, echo, fable, onyx, nova, shimmer

# ASR 설정
asr:
  provider: "whisper"  # whisper, faster_whisper

  # Whisper 설정
  whisper:
    model: "base"  # tiny, base, small, medium, large
    language: "ko"
    device: "auto"

# 캐릭터 설정
character:
  default_name: "Pero"
  default_persona: |
    당신은 친근하고 유쾌한 AI 어시스턴트입니다.
    사용자의 좋은 친구처럼 대화하며, 도움이 필요할 때 언제든 지원합니다.
    게임을 하거나 공부할 때 곁에서 응원하고 격려해줍니다.

# 애니메이션 설정
animation:
  provider: "liveportrait"  # liveportrait, musetalk, sadtalker, wav2lip
  enable: true  # 애니메이션 활성화 여부

  # LivePortrait + JoyVASA 설정 (권장)
  liveportrait:
    liveportrait_path: null  # FasterLivePortrait 경로 (null이면 ~/FasterLivePortrait)
    joyvasa_path: null  # JoyVASA 경로 (null이면 ~/JoyVASA)
    device: "auto"  # auto, cpu, cuda
    fps: 30  # 출력 비디오 FPS
    use_tensorrt: true  # TensorRT 최적화 (RTX GPU 권장)
    backend: "joyvasa"  # joyvasa (오디오 드리븐) 또는 template (모션 템플릿)

  # Idle 애니메이션 설정
  idle:
    enabled: true
    blink_interval_min: 2.0  # 눈 깜빡임 최소 간격 (초)
    blink_interval_max: 6.0  # 눈 깜빡임 최대 간격 (초)
    head_sway_amount: 0.02  # 머리 흔들림 크기
    breathing_amount: 0.03  # 호흡 크기
    preset: "calm"  # calm, alert, sleepy

  # MuseTalk 설정 (레거시)
  musetalk:
    model_path: null
    device: "auto"
    fps: 25

  # 레거시 설정
  quality: "medium"
  expressions: ["neutral", "happy", "sad", "surprised", "thinking"]

# 동적 모드 전환 설정
adaptive_mode:
  enable: true
  gpu_threshold: 60  # GPU 사용률 60% 이상이면 백그라운드 모드
  check_interval: 5  # 5초마다 체크

  # 게임 프로세스 감지
  game_processes:
    - "valorant.exe"
    - "league of legends.exe"
    - "overwatch.exe"
    - "csgo.exe"
    - "apex_legends.exe"
